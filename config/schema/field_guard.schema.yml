field_guard.settings:
  type: config_object
  label: 'Field Guard settings'
  mapping:
    protected:
      type: sequence
      label: 'Protected fields, keyed by entity type'
      sequence:
        type: sequence
        label: 'Bundles'
        sequence:
          type: sequence
          label: 'Fields'
          sequence:
            type: mapping
            label: 'Operations'
            # A closed set, deliberately. ProtectedFieldMap::OPERATIONS honours
            # only 'view' and 'edit'. The three outer levels stay sequences on
            # purpose: their keys are genuinely arbitrary.
            mapping:
              view:
                type: string
                label: 'Permission required to view the field'
              edit:
                type: string
                label: 'Permission required to edit the field'
              # Opt-in, view only. Only boolean true enables it.
              view_exempt_own_subject:
                type: boolean
                label: 'Exempt the record subject from the view guard'
