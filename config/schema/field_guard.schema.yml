field_guard.settings:
  type: config_object
  label: 'Field Guard settings'
  mapping:
    protected:
      type: sequence
      label: 'Protected fields, keyed by entity type'
      sequence:
        type: sequence
        label: 'Bundles'
        sequence:
          type: sequence
          label: 'Fields'
          sequence:
            type: mapping
            label: 'Operations'
            # A closed set, deliberately. ProtectedFieldMap::OPERATIONS honours only
            # 'view' and 'edit', and an unrecognised key is treated as unprotected --
            # so a typo ('viewed', 'Edit', 'delete') would silently leave the field
            # open while this config claims it is protected. Modelled as a mapping
            # rather than a sequence so that typo is a schema violation at save time
            # instead of a quietly ignored key.
            #
            # The three outer levels stay sequences on purpose: their keys are
            # genuinely arbitrary (entity type, bundle, field name), and `sequence` is
            # how Drupal models a variable-keyed map -- see filter.format.*.filters,
            # a sequence keyed by filter plugin ID. There is no "wildcard mapping" type.
            #
            # Both keys are optional: omitting one is how you protect an operation
            # without protecting the other.
            mapping:
              view:
                type: string
                label: 'Permission required to view the field'
              edit:
                type: string
                label: 'Permission required to edit the field'
              # Opt-in, view only. TRUE stands the view guard down when the
              # entity carrying the field ultimately hangs from the acting
              # user's OWN account (duck-typed getParentEntity() walk). There
              # is deliberately no edit counterpart: a record its subject can
              # rewrite is not evidence. Only boolean true enables it.
              view_exempt_own_subject:
                type: boolean
                label: 'Exempt the record subject from the view guard'
