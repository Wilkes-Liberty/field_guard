name: 'Field Guard MCP'
type: module
description: 'Optional read-only Tool API plugins that list guarded fields and report the guard verdict for the acting account, governed by MCP Sentinel.'
package: Security
# Field Guard declares ^10.6 || ^11.3 || ^12. MCP Sentinel does not declare
# Drupal 12 yet, so this submodule cannot either.
core_version_requirement: ^10.6 || ^11.3
dependencies:
  - field_guard:field_guard
  - mcp_sentinel:mcp_sentinel (>=2.22.0)
  - tool:tool (>=1.0.0-beta8)
