################
# Drupal GitLabCI template for contrib modules.
#
# Replicates DrupalCI testing via the centrally maintained include files.
# https://www.drupal.org/docs/develop/git/using-gitlab-to-contribute-to-drupal
################

include:
  - project: $_GITLAB_TEMPLATES_REPO
    ref: $_GITLAB_TEMPLATES_REF
    file:
      - '/includes/include.drupalci.main.yml'
      - '/includes/include.drupalci.variables.yml'
      - '/includes/include.drupalci.workflows.yml'

variables:
  _GITLAB_TEMPLATES_REPO: project/gitlab_templates
  _GITLAB_TEMPLATES_REF: main
  # Curl assets must track the same ref as the include. Without this, scripts
  # still come from default-ref while the YAML comes from main.
  _CURL_TEMPLATES_REF: main
  # This module declares `^10.6 || ^11.3 || ^12`. A support claim CI does not
  # exercise is not a claim, so each branch of that constraint gets a job.
  # OPT_IN_* surfaces the job; _AUTORUN_* ('all') makes it run automatically
  # rather than sitting there as a manual button nobody presses.
  #
  # PREVIOUS_MAJOR = newest 10.x satisfying the constraint (10.6, the D10 floor).
  # PREVIOUS_MINOR = prior minor of the current major (11.3, the D11 floor).
  # composer.json requires php >=8.1, which is CORE_PREVIOUS_PHP_MIN.
  # Do not skip the lane or raise the PHP/core floor: there is no mismatch.
  OPT_IN_TEST_PREVIOUS_MAJOR: '1'
  OPT_IN_TEST_PREVIOUS_MINOR: '1'
  _AUTORUN_PREVIOUS_MAJOR: 'all'
  _AUTORUN_PREVIOUS_MINOR: 'all'
  # PHP-only module: no JS, CSS, Twig, or Nightwatch tests. Templates default
  # eslint, stylelint, and Nightwatch on. Nightwatch's job rule is
  # SKIP_NIGHTWATCH=0 && OPT_IN_TEST_*, so the previous-major/minor autorun
  # above would schedule a browser suite on every opted-in variant. Pin all
  # four skips. Twig CS Fixer already defaults off in the templates; the pin
  # keeps a future default flip from turning it back on. Leave phpcs,
  # phpstan, cspell, composer-lint, and phpunit on.
  SKIP_NIGHTWATCH: '1'
  SKIP_ESLINT: '1'
  SKIP_STYLELINT: '1'
  SKIP_TWIG_CS_FIXER: '1'
  # The `^12` half of the constraint. Deliberately MANUAL rather than autorun:
  # the next major is a moving dev target, and a pipeline that goes red on
  # upstream churn teaches nothing and trains people to ignore the badge. Run it
  # before tagging, and drop `^12` from the constraint if it stops passing.
  OPT_IN_TEST_NEXT_MAJOR: '1'
  # Forward-compat signal on the upcoming minor, available on demand.
  OPT_IN_TEST_NEXT_MINOR: '1'
